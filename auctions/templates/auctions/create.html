{% extends "auctions/layout.html" %}
{% load static %}
{% block body %}
    {% if message %}
    <div class="container">
        <div class="alert alert-success" role="alert">
            <ul>
                {% for msg in message %}
                    <li>
                        <p>{{ msg }}</p>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
    {% endif %}
    <div class="container">
        <div class="hero">
            <form action="{% url 'create' %}" method="post" >
                <div class="logo">Add Item</div>
                {% csrf_token %}
                <div class="form-group">
                    <label for="title">Title (required) Maximum of 64 characters</label>
                    <input type="text" name="title" class="form-control" id="title" placeholder="Name (Required)" value="{{ title }}" required>
                </div>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                      <label class="input-group-text" for="category">Category</label>
                    </div>
                    <select name="category" class="custom-select" id="category">
                        <option value="" >No category</option>
                        {% for category in categories %}
                            {% if ctgry == category.id %}
                                <option selected value="{{ category.id }}" >{{ category }}</option>
                            {% else %}
                                <option value="{{ category.id }}" >{{ category }}</option>
                            {% endif %}
                        {% endfor %}    
                    </select>
                </div>
                <label for="price">Starting bid (required), greater than 0 but less than ¥9,999,999</label>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text">¥</span>
                    </div>
                    <input type="text" name="price" class="form-control" id="price" aria-label="Amount (to the nearest dollar)" style="width: 200px;" value="{{ price }}" required>
                    <div class="input-group-append">
                        <span class="input-group-text">円</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="price">Description (required), maximum 900 characters</label>
                    <textarea name="description" class="form-control"  id="description" placeholder="Description (Required)" style="width: 100%; height:150px;" required>{{ description }}</textarea>
                </div>
                <div class="form-group">
                    <label for="image">Image url (required)</label>
                    <input type="text" name="image" class="form-control"  id="image" placeholder="Image Url (required)"  value="{{ img }}" required>
                </div>
                <input type="submit" value="Submit" class="btn btn-primary">
            </form>
        </div>
    </div>

<link
rel="stylesheet"
type="text/css"
href="{% static 'auctions/create.css' %}?v={{ STATIC_VERSION }}"
/>
{% endblock %}
